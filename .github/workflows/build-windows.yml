name: Build EV AI for Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the app folder (the one with main.py)
        shell: pwsh
        run: |
          $main = Get-ChildItem -Recurse -Filter main.py | Where-Object { $_.FullName -notmatch "venv|site-packages" } | Select-Object -First 1
          $dir = $main.DirectoryName
          echo "APPDIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "App folder: $dir"
      - name: Install requirements
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          if (-not (Test-Path EV_AI.spec)) { Copy-Item "$env:GITHUB_WORKSPACE/EV_AI.spec" . -ErrorAction SilentlyContinue }
          pyinstaller EV_AI.spec --noconfirm
      - name: Size report
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          $rows = Get-ChildItem dist/EV_AI/_internal | ForEach-Object {
            $sz = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ Name = $_.Name; MB = [math]::Round($sz / 1MB, 1) }
          } | Sort-Object MB -Descending | Select-Object -First 25
          $txt = ($rows | ForEach-Object { "$($_.Name)=$($_.MB)" }) -join "; "
          Write-Host "::notice title=Size report::$txt"
      - name: Zip
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: 7z a -tzip -mx=9 EV_AI-Windows.zip dist/EV_AI
      - name: Write update manifest
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash EV_AI-Windows.zip -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ github.ref_name }}"
          $env:EV_SHA = $hash
          $env:EV_ZIP_URL = "https://github.com/${{ github.repository }}/releases/download/$tag/EV_AI-Windows.zip"
          python -c "import json,os,app_version as a; json.dump({'version':a.VERSION,'url':'https://github.com/${{ github.repository }}/releases/latest','notes':getattr(a,'RELEASE_NOTES',''),'zip_url':os.environ['EV_ZIP_URL'],'sha256':os.environ['EV_SHA']}, open('version-windows.json','w'))"
          Get-Content version-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: EV_AI-Windows
          path: ${{ env.APPDIR }}/EV_AI-Windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APPDIR }}/EV_AI-Windows.zip
            ${{ env.APPDIR }}/version-windows.json
